# Weekly grouped dependency updates. Minor and patch bumps arrive as one PR
# per ecosystem and directory. Majors come as their own PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript 7.13.0 declares a peer of typescript ^5.x, so npm ci fails on TypeScript 7 (2026-11-08).
      # Drop when openapi-typescript accepts TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
